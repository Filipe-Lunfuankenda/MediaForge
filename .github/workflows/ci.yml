name: Release Pipeline
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu, x86_64-apple-darwin

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM dependencies
        run: npm ci

      - name: Create local directories
        run: |
          mkdir -p src-tauri/bin
          mkdir -p src-tauri/models

      - name: Download Llama Model (Qwen)
        run: curl -L "https://huggingface.co/Qwen/Qwen2-0.5B-Instruct-GGUF/resolve/main/qwen2-0_5b-instruct-q4_k_m.gguf?download=true" -o "src-tauri/models/model.gguf"

      # Windows Download
      - name: Download Windows Heavy Binaries
        if: matrix.os == 'windows-latest'
        run: |
          curl -L "https://github.com/ggml-org/llama.cpp/releases/download/b3600/llama-b3600-bin-win-noavx-x64.zip" -o llama.zip
          7z x llama.zip -ollama_temp
          cp llama_temp/llama-cli.exe src-tauri/bin/
          cp llama_temp/*.dll src-tauri/bin/
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          7z x ffmpeg.zip -offmpeg_temp
          cp ffmpeg_temp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe src-tauri/bin/
          cp ffmpeg_temp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe src-tauri/bin/
          cp ffmpeg_temp/ffmpeg-master-latest-win64-gpl/bin/ffplay.exe src-tauri/bin/

      # Linux Download
      - name: Download Linux Heavy Binaries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          curl -L "https://github.com/ggml-org/llama.cpp/releases/download/b3600/llama-b3600-bin-ubuntu-x64.zip" -o llama.zip
          unzip llama.zip -d llama_temp
          cp llama_temp/llama-cli src-tauri/bin/
          curl -L "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          find . -name "ffmpeg" -exec cp {} src-tauri/bin/ \;
          find . -name "ffprobe" -exec cp {} src-tauri/bin/ \;
          chmod +x src-tauri/bin/*

      # Mac Download
      - name: Download Mac Heavy Binaries
        if: matrix.os == 'macos-latest'
        run: |
          curl -L "https://github.com/ggml-org/llama.cpp/releases/download/b3600/llama-b3600-bin-macos-x64.zip" -o llama.zip
          unzip llama.zip -d llama_temp
          cp llama_temp/llama-cli src-tauri/bin/
          curl -L "https://evermeet.cx/ffmpeg/ffmpeg-6.0.zip" -o ffmpeg.zip
          unzip ffmpeg.zip -d src-tauri/bin/
          chmod +x src-tauri/bin/*

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests (E2E & Chaos)
        run: npx playwright test
        
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 14

      - name: Run Rust Tests (Backend)
        run: cargo test
        working-directory: ./src-tauri

      - name: Build Tauri App (Executables)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.0
          releaseName: "MediaForge Release v0.1.0"
          releaseBody: "O MediaForge agora com IA local empacotada."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
