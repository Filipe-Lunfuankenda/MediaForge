name: Release Pipeline
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM dependencies
        run: npm ci

      - name: Create local directories
        run: |
          mkdir -p src-tauri/bin
          mkdir -p src-tauri/models

      - name: Download Llama Model (Qwen)
        run: curl -L "https://huggingface.co/Qwen/Qwen2-0.5B-Instruct-GGUF/resolve/main/qwen2-0_5b-instruct-q4_k_m.gguf?download=true" -o "src-tauri/models/model.gguf"

      # Windows Download
      - name: Download Windows Heavy Binaries
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          curl -L "https://github.com/ggml-org/llama.cpp/releases/download/b3600/llama-b3600-bin-win-noavx-x64.zip" -o llama.zip
          7z x llama.zip -ollama_temp
          Get-ChildItem -Path llama_temp -Filter "llama-cli*.exe" -Recurse | Copy-Item -Destination "src-tauri/bin/llama-cli.exe" -Force
          Get-ChildItem -Path llama_temp -Filter "*.dll" -Recurse | Copy-Item -Destination "src-tauri/bin/" -Force
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          7z x ffmpeg.zip -offmpeg_temp
          Copy-Item ffmpeg_temp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe src-tauri/bin/ffmpeg.exe -Force
          Copy-Item ffmpeg_temp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe -Force
          Copy-Item ffmpeg_temp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe src-tauri/bin/ffprobe.exe -Force
          Copy-Item ffmpeg_temp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe src-tauri/bin/ffprobe-x86_64-pc-windows-msvc.exe -Force

      # Linux Download
      - name: Download Linux Heavy Binaries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          curl -L "https://github.com/ggml-org/llama.cpp/releases/download/b3600/llama-b3600-bin-ubuntu-x64.zip" -o llama.zip
          unzip -q llama.zip -d llama_temp
          find llama_temp -type f -name "llama-cli*" -exec cp {} src-tauri/bin/llama-cli \;
          find llama_temp -type f -name "*.so*" -exec cp {} src-tauri/bin/ \; || true
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cp $(which ffmpeg) src-tauri/bin/ffmpeg
          cp $(which ffmpeg) src-tauri/bin/ffmpeg-x86_64-unknown-linux-gnu
          cp $(which ffprobe) src-tauri/bin/ffprobe
          cp $(which ffprobe) src-tauri/bin/ffprobe-x86_64-unknown-linux-gnu
          chmod +x src-tauri/bin/*

      # Mac Download
      - name: Download Mac Heavy Binaries
        if: matrix.os == 'macos-latest'
        run: |
          curl -L "https://github.com/ggml-org/llama.cpp/releases/download/b3600/llama-b3600-bin-macos-arm64.zip" -o llama.zip
          unzip -q llama.zip -d llama_temp
          find llama_temp -type f -name "llama-cli*" -exec cp {} src-tauri/bin/llama-cli \;
          find llama_temp -type f -name "*.dylib*" -exec cp {} src-tauri/bin/ \; || true
          brew install ffmpeg
          cp $(which ffmpeg) src-tauri/bin/ffmpeg
          cp $(which ffmpeg) src-tauri/bin/ffmpeg-aarch64-apple-darwin
          cp $(which ffprobe) src-tauri/bin/ffprobe
          cp $(which ffprobe) src-tauri/bin/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/bin/*

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests (E2E & Chaos)
        run: npx playwright test

      - name: Ensure Playwright report exists
        if: always()
        shell: bash
        run: |
          mkdir -p playwright-report
          echo "Workflow execution on ${{ matrix.os }} completed at $(date)" > playwright-report/runner-execution.log

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 14

      - name: Run Rust Tests (Backend)
        run: cargo test
        working-directory: ./src-tauri

      - name: Build Tauri App (Executables)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.0
          releaseName: "MediaForge Release v0.1.0"
          releaseBody: "O MediaForge agora com IA local empacotada."
          releaseDraft: true
          prerelease: false
